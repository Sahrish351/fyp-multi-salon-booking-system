<svg viewBox="0 4 460 114" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4E8A"/>
      <stop offset="50%" stop-color="#E4A0AE"/>
      <stop offset="100%" stop-color="#C9975A"/>
    </linearGradient>
  </defs>

  <!-- Delicate butterfly -->
  <g transform="translate(14,18) scale(1)">
    <!-- body -->
    <path d="M50,20 C47,20 46,26 46,34 C46,50 48,60 50,80 C52,60 54,50 54,34 C54,26 53,20 50,20 Z" fill="url(#bbGrad)"/>

    <!-- upper left wing, layered -->
    <path d="M49,36 C38,14 18,4 8,12 C1,18 4,30 14,34 C24,38 40,38 49,36 Z" fill="url(#bbGrad)" opacity="0.9"/>
    <path d="M49,36 C41,22 28,15 20,18 C14,21 15,29 22,31 C30,34 41,35 49,36 Z" fill="#FFFFFF" opacity="0.35"/>

    <!-- lower left wing, layered -->
    <path d="M49,44 C41,62 24,74 13,70 C5,67 5,55 15,50 C25,45 40,43 49,44 Z" fill="url(#bbGrad)" opacity="0.78"/>
    <path d="M49,44 C43,55 33,63 25,61 C19,59 20,52 26,49 C33,46 42,45 49,44 Z" fill="#FFFFFF" opacity="0.3"/>

    <!-- upper right wing, layered (mirror) -->
    <path d="M51,36 C62,14 82,4 92,12 C99,18 96,30 86,34 C76,38 60,38 51,36 Z" fill="url(#bbGrad)" opacity="0.9"/>
    <path d="M51,36 C59,22 72,15 80,18 C86,21 85,29 78,31 C70,34 59,35 51,36 Z" fill="#FFFFFF" opacity="0.35"/>

    <!-- lower right wing, layered (mirror) -->
    <path d="M51,44 C59,62 76,74 87,70 C95,67 95,55 85,50 C75,45 60,43 51,44 Z" fill="url(#bbGrad)" opacity="0.78"/>
    <path d="M51,44 C57,55 67,63 75,61 C81,59 80,52 74,49 C67,46 58,45 51,44 Z" fill="#FFFFFF" opacity="0.3"/>

    <!-- fine wing veins -->
    <path d="M46,32 C36,24 24,20 16,22" stroke="url(#bbGrad)" stroke-width="0.6" fill="none" opacity="0.6"/>
    <path d="M46,46 C38,54 28,60 20,60" stroke="url(#bbGrad)" stroke-width="0.6" fill="none" opacity="0.6"/>
    <path d="M54,32 C64,24 76,20 84,22" stroke="url(#bbGrad)" stroke-width="0.6" fill="none" opacity="0.6"/>
    <path d="M54,46 C62,54 72,60 80,60" stroke="url(#bbGrad)" stroke-width="0.6" fill="none" opacity="0.6"/>

    <!-- antennae, curled -->
    <path d="M48,21 C45,13 38,8 32,10 C29,11 29,15 32,15" stroke="url(#bbGrad)" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M52,21 C55,13 62,8 68,10 C71,11 71,15 68,15" stroke="url(#bbGrad)" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <circle cx="32" cy="15" r="1.4" fill="url(#bbGrad)"/>
    <circle cx="68" cy="15" r="1.4" fill="url(#bbGrad)"/>
  </g>

  <!-- Wordmark -->
  <text x="130" y="80" font-family="'Segoe Script','Brush Script MT',cursive" font-size="48" fill="url(#bbGrad)">Beauty Blush</text>
  <text x="134" y="109" font-family="Georgia, serif" font-size="19" font-weight="700" letter-spacing="6" fill="#9C6B4E">S A L O N</text>
</svg>
